; Scoped to this project only (PHP reads .user.ini per-directory under
; php-fpm/CGI, unlike the global php.ini) — raises the upload ceiling so a
; ~60s hero video isn't rejected before Laravel's own validation even runs.
; post_max_size must stay above upload_max_filesize to leave room for the
; request's other form fields.
upload_max_filesize = 100M
post_max_size = 110M
max_execution_time = 300
max_input_time = 300
